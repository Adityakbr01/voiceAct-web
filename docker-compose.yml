services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: voiceact-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: voiceact
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/voiceact --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Express API Server
  server:
    image: ${DOCKERHUB_USERNAME:-adityakbr}/voiceact-server:latest
    container_name: voiceact-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_API_PORT:-5001}:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Web Frontend
  web:
    image: ${DOCKERHUB_USERNAME:-adityakbr}/voiceact-web:latest
    container_name: voiceact-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo-data:
    driver: local

networks:
  default:
    name: voiceact-network
