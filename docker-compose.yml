services:
  # Express API Server
  server:
    image: ${DOCKERHUB_USERNAME:-adityakbr}/voiceact-server:latest
    container_name: voiceact-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_API_PORT:-5001}:5000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Web Frontend
  web:
    image: ${DOCKERHUB_USERNAME:-adityakbr}/voiceact-web:latest
    container_name: voiceact-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_WEB_PORT:-3001}:3000"
    env_file:
      - path: ./web/.env
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: voiceact-network
