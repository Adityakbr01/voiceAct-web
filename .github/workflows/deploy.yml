name: Docker Hub Build & VPS Deployment

on:
  push:
    branches: [main, master]

jobs:
  # ─── Job 1: Build & Push Server Image (Parallel) ───────────────────────────
  build-server:
    name: Build & Push Server Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiceact-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 2: Build & Push Web Image (Parallel) ──────────────────────────────
  build-web:
    name: Build & Push Web Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://voiceact.tech/api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/voiceact-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 3: Pull & Deploy on VPS ───────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [build-server, build-web]
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Deploy Latest Container Stack
        run: |
          # 1. Create the production directory structure if it doesn't exist
          mkdir -p ~/apps/voiceAct-web/server ~/apps/voiceAct-web/web
          
          # 2. Ensure .env files exist in their respective directories so docker compose doesn't fail
          touch ~/apps/voiceAct-web/server/.env
          touch ~/apps/voiceAct-web/web/.env

          # 3. Copy only docker-compose.yml to the production directory
          cp docker-compose.yml ~/apps/voiceAct-web/
          
          # 4. Enter the production directory
          cd ~/apps/voiceAct-web

          # 4. Log in to Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # 5. Pull latest pre-built images from Docker Hub
          docker compose pull
          
          # 6. Replace running containers with latest images
          docker compose up -d --remove-orphans
          
          # 7. Clean up old unused images securely
          docker image prune -f
